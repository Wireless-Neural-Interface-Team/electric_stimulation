[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "electric_stimulation"
version = "0.4.0"
description = "NI-DAQmx trigger generator for electrical stimulation with PyQt5 GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Wireless Neural Interface Team"},
    {name = "Pierre He", email = "pierre.he@inserm.fr"},
]
keywords = ["DAQ", "NI-DAQmx", "electrical_stimulation", "trigger-generator", "PyQt5"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20",
    "PyDAQmx>=1.4",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
trigger-generator = "electric_stimulation.gui:main"
trigger-generator-build = "electric_stimulation.build_exe:main"

[project.urls]
Homepage = "https://github.com/WNIlabs/electric_stimulation"
Repository = "https://github.com/WNIlabs/electric_stimulation"
